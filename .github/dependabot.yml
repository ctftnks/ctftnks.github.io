version: 2
updates:
  # Maintain npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    groups:
      eslint:
        # All ESLint-related packages in one PR (major + minor + patch)
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
      npm-all:
        # Everything else (major + minor + patch) in one PR
        patterns:
          - "*"
    ignore:
      # typescript-eslint and typedoc don't support the TS7 Go compiler API yet.
      # Re-enable once typescript-eslint releases TS7 support (expected ~TS 7.1).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        # All GitHub Actions updates (major + minor + patch) in one PR
        patterns:
          - "*"
